<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Location Share</title>
<style>
body{font-family:Arial,sans-serif;max-width:520px;margin:50px auto;padding:20px;text-align:center}
button{padding:14px 22px;font-size:16px;border:0;border-radius:10px;cursor:pointer}
#status{margin-top:20px;line-height:1.6}
</style>
</head>
<body>
<h2>📍 अपनी लोकेशन शेयर करें</h2>
<p>यह पेज आपकी अनुमति के बाद ही आपकी लोकेशन शेयर करेगा।</p>
<button id="share">लोकेशन शेयर करें</button>
<div id="status"></div>

<script>
const status = document.getElementById("status");
document.getElementById("share").onclick = () => {
  if (!navigator.geolocation) {
    status.textContent = "इस डिवाइस में Location सुविधा उपलब्ध नहीं है।";
    return;
  }
  status.textContent = "Location permission का इंतज़ार है…";
  navigator.geolocation.getCurrentPosition(async (pos) => {
    const data = {
      latitude: pos.coords.latitude,
      longitude: pos.coords.longitude,
      accuracy: pos.coords.accuracy,
      timestamp: new Date().toISOString()
    };
    try {
      const r = await fetch("/api/location", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify(data)
      });
      if (!r.ok) throw new Error("server error");
      status.innerHTML = "✅ आपकी लोकेशन शेयर हो गई।";
    } catch(e) {
      status.textContent = "लोकेशन भेजने में समस्या हुई।";
    }
  }, (err) => {
    status.textContent = "❌ Location permission नहीं मिली या Location बंद है।";
  }, {enableHighAccuracy:true, timeout:15000, maximumAge:0});
};
</script>
</body>
</html>
